  <meta name="author" content="Stefan (Freedom Technology)">

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <meta property="og:title" content="Freedom Technology">

<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="live-announcer" aria-live="polite" aria-atomic="true"></div>

  <div id="partials-anchor">

    <section class="hero" aria-labelledby="hero-heading">
      <h1 id="hero-heading" class="hero-title">Freedom Technology</h1>
      <p class="hero-lead">
        Welcome! We're so glad you're here. We create digital tools, programs, and games
        that everyone can enjoy — especially people who are blind or have low vision.
        Take a look around!
      </p>
    </section>

    <figure class="hero-illustration" aria-labelledby="illust-heading">
      <h2 id="illust-heading" class="sr-only">Inclusive digital workspace illustration</h2>
      <img src="assets/images/hero-illustration.svg"
           alt="Diverse people gathered around a large monitor with audio waves, braille dots, and accessibility symbols."
           width="960" height="420" loading="eager">
      <figcaption class="hero-caption">
        Freedom, inclusion, fun, and accessibility — for everyone, everywhere.
      </figcaption>
    </figure>

  </div>

  <script src="js/partials.js"></script>
  <script src="js/main.js"></script>
